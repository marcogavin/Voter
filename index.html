<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the page reach the screen edges on a notched
     phone, which is also what makes env(safe-area-inset-*) report real
     values — the stylesheet uses them to keep clear of the notch and the
     home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VOTR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="frame">
    <div class="panel">
      <div class="top-row">
        <div class="mark">
          <img class="logo" src="img/votr-logo.svg" alt="VOTR">
        </div>
      </div>
      <h1 id="question">Connecting…</h1>
      <div id="options"></div>
      <div class="foot">
        <p class="note" id="note" data-i18n="oneVotePerQuestion">One vote per question</p>
        <span class="badge" id="status" data-state="pending" data-i18n="connecting">Connecting</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
