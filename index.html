<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="frame">
    <div class="panel">
      <div class="top-row">
        <p class="eyebrow">Live poll</p>
        <div class="mark"><span class="dot"></span><span class="word">VOTER</span></div>
      </div>
      <h1 id="question">Connecting…</h1>
      <div id="options"></div>
      <div class="foot">
        <p class="note" id="note">One vote per question</p>
        <span class="badge" id="status" data-state="pending">Connecting</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
