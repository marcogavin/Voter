<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the page reach the screen edges on a notched
     phone, which is also what makes env(safe-area-inset-*) report real
     values — the stylesheet uses them to keep clear of the notch and the
     home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VOTR</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="frame">
    <div class="panel">
      <div class="top-row">
        <p class="eyebrow" data-i18n="livePoll">Live poll</p>
        <div class="mark">
          <!-- Rising bars: the same meter motif the results are drawn with. -->
          <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
            <rect class="logo-plate" x="0" y="0" width="24" height="24" rx="6"/>
            <rect class="logo-bar" x="5.5"  y="13" width="3.5" height="6"  rx="1.75"/>
            <rect class="logo-bar" x="10.25" y="9" width="3.5" height="10" rx="1.75"/>
            <rect class="logo-bar" x="15"   y="5" width="3.5" height="14" rx="1.75"/>
          </svg>
          <span class="word">VOTR</span>
        </div>
      </div>
      <h1 id="question">Connecting…</h1>
      <div id="options"></div>
      <div class="foot">
        <p class="note" id="note" data-i18n="oneVotePerQuestion">One vote per question</p>
        <span class="badge" id="status" data-state="pending" data-i18n="connecting">Connecting</span>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
