<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOTR — Host</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="host">
  <div class="frame">
    <div class="panel">
      <div class="top-row">
        <p class="eyebrow" data-i18n="hostControl">Host control</p>
        <div class="mark">
          <img class="logo" src="img/votr-logo.svg" alt="VOTR">
        </div>
      </div>

      <div class="hostbar group">
        <span class="hostbar-who" id="account"></span>
        <button type="button" class="btn" id="qr">
          <span class="btn-icon" data-icon="qr"></span>
          <span class="btn-label" data-i18n="qrCode">QR code</span>
        </button>
        <button type="button" class="btn" id="signin">
          <span class="btn-icon" data-icon="signIn"></span>
          <span class="btn-label" data-i18n="signIn">Sign in</span>
        </button>
        <button type="button" class="iconbtn" id="signout" data-icon="signOut" hidden></button>
      </div>

      <div class="tabs" id="tabs" role="tablist">
        <button type="button" class="tab is-active" id="tab-setup" role="tab" data-i18n="tabSetup">Setup poll</button>
        <button type="button" class="tab" id="tab-run" role="tab" data-i18n="tabRun">Run poll</button>
      </div>

      <p class="panel-message" id="signed-out" data-i18n="signedOutNote" hidden>
        Sign in with Google to set up and run polls.
      </p>

      <!-- ── Setup: write the questions before the event ─────────────────── -->
      <section id="view-setup">
        <h2 class="section-title section-title--first" data-i18n="pickOrCreateSurvey">
          Pick an existing survey or create a new one
        </h2>

        <button type="button" class="btn btn--wide btn--outline" id="deck-new">
          <span class="btn-icon" data-icon="plus"></span>
          <span class="btn-label" data-i18n="newSurvey">Create a new survey</span>
        </button>

        <div class="deckbar group">
          <div class="field field--pick deckbar-pick">
            <select id="deck"></select>
          </div>
          <div class="deckbtns">
            <button type="button" class="iconbtn" id="deck-rename" data-icon="edit"></button>
            <button type="button" class="iconbtn" id="deck-delete" data-icon="remove"></button>
          </div>
        </div>

        <h2 class="section-title" data-i18n="questionsSection">Questions</h2>

        <form id="editor" class="setup">
          <label class="field">
            <span class="counted">
              <span class="field-label" id="editor-label">Question 1</span>
              <span class="charcount" id="question-count"></span>
            </span>
            <input id="question-input" type="text" maxlength="200" required
                   data-i18n-placeholder="questionPlaceholder"
                   placeholder="What's your age?" autocomplete="off">
          </label>
          <label class="field">
            <span class="field-label" data-i18n="optionsLabel">Options — one per line</span>
            <textarea id="options-input" rows="3" required
                      data-i18n-placeholder="optionsPlaceholder"
                      placeholder="Under 30&#10;30–50&#10;Over 50"></textarea>
            <div class="charlist" id="options-count"></div>
          </label>
          <div class="field">
            <span class="field-label" data-i18n="correctLabel">Right answer — optional</span>
            <div id="correct-list" class="correct-list"></div>
          </div>
          <p class="form-error" id="form-error" hidden></p>
          <div class="actions">
            <button type="submit" class="btn btn--primary" id="save"><span class="btn-label" data-i18n="addQuestion">Add question</span></button>
            <button type="button" class="btn" id="cancel" hidden><span class="btn-label" data-i18n="cancel">Cancel</span></button>
          </div>
        </form>

        <ol id="question-list" class="qlist"></ol>
        <p class="panel-message" id="setup-empty" data-i18n="noQuestionsYet">No questions yet — add your first above.</p>

        <h2 class="section-title" data-i18n="settingsSection">Settings</h2>

        <div class="settings">
          <label class="field field--pick">
            <span class="field-label" data-i18n="language">Language</span>
            <select id="language"></select>
          </label>
          <label class="field field--pick">
            <span class="field-label" data-i18n="timeLimit">Time limit</span>
            <select id="seconds"></select>
          </label>
        </div>
      </section>

      <!-- ── Run: drive the event ────────────────────────────────────────── -->
      <section id="view-run" hidden>
        <p class="deckname" id="run-deck"></p>
        <h1 id="run-question">Nothing on screen</h1>
        <div id="options"></div>

        <div class="runbar group">
          <button type="button" class="btn" id="prev">
            <span class="btn-icon" data-icon="prev"></span>
            <span class="btn-label" data-i18n="prev">Prev</span>
          </button>
          <span class="counter" id="counter">—</span>
          <button type="button" class="btn btn--primary" id="next">
            <span class="btn-label" data-i18n="start">Start</span>
            <span class="btn-icon" data-icon="next"></span>
          </button>
        </div>
        <div class="actions group">
          <button type="button" class="btn" id="blank">
            <span class="btn-icon" data-icon="hide"></span>
            <span class="btn-label" data-i18n="hideScreen">Hide screen</span>
          </button>
          <button type="button" class="btn" id="reopen" hidden>
            <span class="btn-icon" data-icon="reopen"></span>
            <span class="btn-label" data-i18n="reopenVoting">Reopen voting</span>
          </button>
          <button type="button" class="btn" id="reset">
            <span class="btn-icon" data-icon="reset"></span>
            <span class="btn-label" data-i18n="resetVotes">Reset votes</span>
          </button>
          <button type="button" class="btn" id="clear">
            <span class="btn-icon" data-icon="startOver"></span>
            <span class="btn-label" data-i18n="startOver">Start over</span>
          </button>
        </div>
      </section>

      <div class="foot">
        <p class="note" id="hint" data-i18n="attendeesHint">Attendees open the audience page on their phones</p>
        <span class="badge" id="status" data-state="pending" data-i18n="connecting">Connecting</span>
      </div>
    </div>
  </div>

  <!-- Naming a survey and confirming a delete. A native prompt() would do the
       job, but it arrives in the browser's language and its own styling. -->
  <div class="overlay" id="ask-overlay" hidden>
    <form class="ask-card" id="ask-form">
      <p class="ask-title" id="ask-title"></p>
      <input type="text" id="ask-input" maxlength="60" autocomplete="off">
      <div class="actions">
        <button type="submit" class="btn btn--primary" id="ask-ok"><span class="btn-label">OK</span></button>
        <button type="button" class="btn" id="ask-cancel"><span class="btn-label" data-i18n="cancel">Cancel</span></button>
      </div>
    </form>
  </div>

  <div class="overlay" id="qr-overlay" hidden>
    <div class="qr-card">
      <div id="qr-art"></div>
      <a class="qr-url" id="qr-url" target="_blank" rel="noopener"></a>
      <button type="button" class="btn btn--primary" id="qr-close"><span class="btn-label" data-i18n="close">Close</span></button>
    </div>
  </div>

  <script type="module" src="js/host.js"></script>

  <!-- The page and its scripts are cached separately, so a browser can serve a
       fresh host.html against yesterday's js/host.js: the new controls appear
       and quietly do nothing, which looks like a broken feature rather than a
       stale file. This runs from the page itself — the half that's fresh — and
       fetches past the cache once before reloading. Deliberately not a module:
       a stale module is the thing it exists to catch. -->
  <script>
    (function () {
      var NEEDS = ["surveys", "timer", "qr", "icons", "gate", "groups", "sections"];
      var FILES = [
        "js/app.js", "js/host.js", "js/sync.js", "js/i18n.js", "js/qr.js",
        "js/firebase-config.js", "js/icons.js", "css/style.css",
      ];
      var TRIED = "votr-refetched";

      addEventListener("load", function () { setTimeout(check, 1500); });

      function check() {
        // The stylesheet is cached separately from both the page and the
        // script, and a stale one looks just as broken, so it says what it
        // is too — through a custom property the page can read back.
        var styled = getComputedStyle(document.documentElement)
          .getPropertyValue("--build").replace(/["']/g, "").trim();
        var built = (window.VOTR_BUILD || [])
          .concat(styled ? styled.split(/\s+/) : []);
        var missing = NEEDS.filter(function (name) {
          return built.indexOf(name) === -1;
        });

        if (!missing.length) return sessionStorage.removeItem(TRIED);

        // Once only. If the refetch didn't help, the old copy is what's being
        // served, and reloading again would just spin.
        if (sessionStorage.getItem(TRIED)) return report(missing);
        sessionStorage.setItem(TRIED, "1");

        Promise.all(FILES.map(function (file) {
          return fetch(file, { cache: "reload" }).catch(function () {});
        })).then(function () { location.reload(); });
      }

      function report(missing) {
        var note = document.createElement("p");
        note.className = "stale";
        note.textContent =
          "This page is running an older copy of VOTR, so some controls " +
          "won't respond (missing: " + missing.join(", ") + "). It updates " +
          "itself within about ten minutes — or close this tab and open it again.";
        document.body.appendChild(note);
      }
    })();
  </script>
</body>
</html>
