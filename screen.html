<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>VOTR — Big screen</title>
<meta name="description" content="The room's shared screen: the question everyone is answering, the scores, and the way in.">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="site.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VOTR">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101014" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="screen">
  <!-- No card and no measure: this page is the whole wall. Three rows —
       what's on, the thing itself, and where it is in the poll. -->
  <div class="big">
    <header class="big-top">
      <img class="logo logo--big" src="img/votr-logo.svg" alt="VOTR">

      <!-- How much of the room has answered, at the top where the room can
           see it. A number that is visibly short of the number of people
           standing there is the most direct way of asking for the rest. -->
      <p class="big-votes" id="votes" hidden></p>

      <!-- For whoever is setting the screen up, not for the room: it fades
           out with the mouse. Hidden outright where the browser can't do
           it. -->
      <button type="button" class="iconbtn big-full" id="full" hidden
              data-icon="expand" aria-label="Full screen"></button>
    </header>

    <main class="big-stage" id="stage">
      <p class="big-message" data-i18n="connecting">Connecting</p>
    </main>

    <footer class="big-foot" id="foot" hidden>
      <p class="big-progress" id="progress" hidden></p>
      <div class="big-clock" id="clock" hidden>
        <span class="big-clock-track">
          <span class="big-clock-fill" id="clock-fill"></span>
        </span>
        <span class="big-clock-time" id="clock-time"></span>
      </div>
      <p class="big-tally" id="tally" hidden></p>

      <!-- The way in, kept in the corner while something else is on, so
           somebody arriving late never has to be told where to go. Bottom
           right, where a code sits on every conference slide ever made — and
           part of the strip rather than floating over it, so a bigger code
           takes room from the question rather than landing on top of it. -->
      <div class="big-corner" id="join" hidden>
        <div class="big-corner-art" id="join-art"></div>
        <p class="big-corner-url" id="join-url"></p>
      </div>
    </footer>
  </div>

  <script type="module" src="js/screen.js"></script>

  <!-- The page and its scripts are cached separately, so a browser can serve a
       fresh screen.html against yesterday's js/screen.js: the new parts appear
       and quietly do nothing, which looks like a broken feature rather than a
       stale file. This runs from the page itself — the half that's fresh — and
       fetches past the cache once before reloading. Deliberately not a module:
       a stale module is the thing it exists to catch. -->
  <script>
    (function () {
      var NEEDS = [
        "screen", "scores", "pause", "timer", "speed", "bigscreen", "times",
        "cornercode", "cornerfoot", "votecount", "votesbadge",
      ];
      var FILES = [
        "js/app.js", "js/host.js", "js/screen.js", "js/sync.js", "js/i18n.js",
        "js/qr.js", "js/firebase-config.js", "js/icons.js", "js/hearts.js",
        "js/scores.js", "css/style.css",
      ];
      var TRIED = "votr-refetched";

      addEventListener("load", function () { setTimeout(check, 1500); });

      function check() {
        var styled = getComputedStyle(document.documentElement)
          .getPropertyValue("--build").replace(/["']/g, "").trim();
        var built = (window.VOTR_BUILD || [])
          .concat(styled ? styled.split(/\s+/) : []);
        var missing = NEEDS.filter(function (name) {
          return built.indexOf(name) === -1;
        });

        if (!missing.length) return sessionStorage.removeItem(TRIED);

        if (sessionStorage.getItem(TRIED)) return report(missing);
        sessionStorage.setItem(TRIED, "1");

        Promise.all(FILES.map(function (file) {
          return fetch(file, { cache: "reload" }).catch(function () {});
        })).then(function () { location.reload(); });
      }

      function report(missing) {
        var note = document.createElement("p");
        note.className = "stale";
        note.textContent =
          "This page is running an older copy of VOTR, so some of it " +
          "won't respond (missing: " + missing.join(", ") + "). It updates " +
          "itself within about ten minutes — or close this tab and open it again.";
        document.body.appendChild(note);
      }
    })();
  </script>
</body>
</html>
